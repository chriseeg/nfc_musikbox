assign_card:
  fields:
    tag_id:
      required: true
      example: "CA-09-0C-05"
      selector:
        text:
    name:
      selector:
        text:
    media:
      required: true
      selector:
        media:
    mode:
      default: tonie
      selector:
        select:
          translation_key: mode
          options:
            - tonie
            - simple
    enabled:
      default: true
      selector:
        boolean:
    readers:
      selector:
        device:
          integration: nfc_musikbox
          multiple: true
    shuffle:
      selector:
        boolean:
    repeat:
      selector:
        select:
          translation_key: repeat
          options:
            - "off"
            - all
            - one
    allow_in_quiet:
      default: false
      selector:
        boolean:

remove_card:
  fields:
    tag_id:
      required: true
      example: "CA-09-0C-05"
      selector:
        text:

reset_position:
  fields:
    tag_id:
      required: true
      example: "CA-09-0C-05"
      selector:
        text:

play_card:
  fields:
    tag_id:
      required: true
      example: "CA-09-0C-05"
      selector:
        text:
    reader:
      selector:
        device:
          integration: nfc_musikbox
    resume:
      default: false
      selector:
        boolean:
