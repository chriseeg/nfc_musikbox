# NFC-Musikbox v5 – ESP32 (Wemos D1 Mini32) + PN532 (I2C) + 2 beleuchtete Taster
# v5: Deckel mit Reed-Schalter (Standby, Begrüßung, Fortsetzen nach dem Öffnen).
# v4: Wiedergabestatus "locked" (von der Integration bei gesperrter Karte) -> LEDs blinken 3×.
# Tonie-Logik: Der Reader meldet nur, WELCHE Karte gerade liegt ("Karte auf dem Reader").
# Alles Weitere (Abspielen, Pause beim Entfernen, Fortsetzen) macht Home Assistant.
#
# Taster:  GPIO26 = einmal Wiedergabe/Pause, doppelt nächster Titel, dreifach vorheriger Titel,
#          gedrückt halten (1 s) = Karte von vorne
#                                                              LED GPIO17
#          Die Zurück-Taste samt LED ist entfernt (neue Logik folgt).
# Reed:    GPIO16 = Reed-Schalter (gegen GND), Magnet im Deckel. Deckel zu = Standby:
#          Karte gilt als entfernt, Home Assistant pausiert, LED klingt aus, Taste ruht.
#          Deckel auf = Begrüßung (Lichtanimation); steht die Karte noch im Deckel,
#          wird sie neu gemeldet und Home Assistant setzt fort.
# Der Reader kennt keinen Lautsprecher. Er nimmt nur den Wiedergabestatus von
# Home Assistant entgegen (API-Aktion set_playback_state) und zeigt ihn per LED.

substitutions:
  name: nfc-musikbox
  friendly_name: NFC Musikbox
  remove_delay: 2s     # so lange darf die Karte "wackeln", bevor sie als entfernt gilt
  # "false": LED an GPIO -> Widerstand -> LED -> GND (leuchtet bei High).
  # "true": LED zwischen 3V3 und GPIO (aktiv-low).
  led_inverted: "false"
  # "true": Magnet am Reed = Standby, "false": Magnet am Reed = Betrieb
  reed_standby_bei_magnet: "true"
  # Höchstens so lange Pause zwischen den Klicks eines Doppel-/Dreifachklicks
  klick_abstand: 350ms

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - text_sensor.template.publish:
          id: playback_state
          state: "unbekannt"
      - text_sensor.template.publish:
          id: current_tag
          state: "none"
      - script.execute: update_play_led

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

logger:
  # Für Tiefen-Debugging des PN532 (sehr gesprächig), Zeilen einkommentieren:
  # level: VERY_VERBOSE
  # logs:
  #   pn532: VERY_VERBOSE

debug:
  update_interval: 60s

api:
  encryption:
    key: !secret nfc_musikbox_api_key
  on_client_connected:
    - script.execute: update_play_led
    # Home Assistant kann darauf reagieren und den aktuellen Status neu senden
    - homeassistant.event:
        event: esphome.nfc_reader_online
        data:
          reader: ${name}
  actions:
    # Wird von Home Assistant aufgerufen: "playing", "paused", "idle" ...
    - action: set_playback_state
      variables:
        player_state: string
      then:
        - if:
            condition:
              # Kindersicherung: Karte gesperrt (Tageslimit, Schlaf-Timer). Status bleibt unverändert.
              lambda: 'return player_state == "locked";'
            then:
              - script.execute: lock_feedback
            else:
              - text_sensor.template.publish:
                  id: playback_state
                  state: !lambda 'return player_state;'
              - script.execute: update_play_led

ota:
  - platform: esphome
    password: !secret nfc_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "NFC-Musikbox Fallback"

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: scan_count
    type: int
    initial_value: '0'
  # Karte, die der PN532 gerade sieht, auch im Standby. Der PN532 meldet eine liegende
  # Karte nur einmal; nach dem Öffnen des Deckels melden wir sie von hier aus neu.
  - id: karte_im_feld
    type: std::string
    initial_value: '""'
  # Läuft eine Lichtanimation, wartet die Status-LED, bis sie fertig ist
  - id: animation
    type: bool
    initial_value: 'false'

# ---------- NFC ----------
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

pn532_i2c:
  id: pn532_reader
  update_interval: 1s
  on_tag:
    then:
      - lambda: 'id(karte_im_feld) = x;'
      - if:
          condition:
            binary_sensor.is_off: standby
          then:
            # Karte (wieder) erkannt: ein ausstehendes "entfernt" abbrechen
            - script.stop: tag_gone
            # Nur ein echtes Einlegen oder ein Kartenwechsel wird gemeldet,
            # kurzes Wackeln derselben Karte nicht.
            - if:
                condition:
                  lambda: 'return id(current_tag).state != x;'
                then:
                  - script.execute:
                      id: karte_melden
                      tag: !lambda 'return x;'
                      quittung: true
  on_tag_removed:
    then:
      - lambda: 'id(karte_im_feld) = "";'
      - if:
          condition:
            binary_sensor.is_off: standby
          then:
            - script.execute: tag_gone

# ---------- Sensoren ----------
sensor:
  - platform: template
    id: scan_count_sensor
    name: "Gescannte Karten (seit Neustart)"
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
  - platform: wifi_signal
    name: "WLAN-Signal"
    update_interval: 60s
  - platform: uptime
    name: "Laufzeit"
  - platform: debug
    free:
      name: "Freier Heap"
    loop_time:
      name: "Loop-Zeit"

text_sensor:
  # Die Karte, die gerade auf dem Reader liegt – "none", wenn keine liegt.
  # Das ist der zentrale Zustand für Home Assistant (Einlegen/Entfernen/Wechsel).
  - platform: template
    id: current_tag
    name: "Karte auf dem Reader"
  # Vom Home Assistant gesetzt, steuert die Play/Pause-LED
  - platform: template
    id: playback_state
    name: "Wiedergabestatus (von HA)"
    entity_category: diagnostic
  - platform: template
    id: last_tag_id
    name: "Letzte Tag-ID"
    entity_category: diagnostic
  - platform: template
    id: last_tag_time
    name: "Letzter Scan"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
    ssid:
      name: "WLAN"
  - platform: debug
    reset_reason:
      name: "Reset-Grund"

# ---------- Tasten-Ereignisse für Home Assistant ----------
event:
  - platform: template
    id: ev_play
    name: "Ereignis Taste Play/Pause"
    event_types: ["kurz", "doppelt", "dreifach", "lang"]

# ---------- Debug-Buttons ----------
button:
  - platform: restart
    name: "Neustart"
  - platform: template
    name: "LED-Test"
    on_press:
      - script.execute: tag_feedback
  - platform: template
    name: "Begrüßung testen"
    entity_category: diagnostic
    on_press:
      - script.execute: begruessung

# ---------- LEDs (PWM) ----------
output:
  - platform: ledc
    pin:
      number: GPIO17
      inverted: ${led_inverted}
    id: out_led_play

light:
  - platform: monochromatic
    output: out_led_play
    id: led_play
    name: "LED Play/Pause"
    restore_mode: ALWAYS_OFF
    default_transition_length: 200ms
    effects:
      - pulse:
          name: Pulse
          transition_length: 1s
          update_interval: 1s
          min_brightness: 5%
          max_brightness: 70%

# ---------- Taster (gegen GND, interner Pull-up) ----------
binary_sensor:
  - platform: template
    id: tag_present
    name: "Karte liegt auf"

  # Reed-Schalter (Schließer gegen GND). Ob der Magnet Standby oder Betrieb bedeutet,
  # steht in reed_standby_bei_magnet. Standby: Karte sofort als entfernt melden.
  - platform: gpio
    id: reed
    name: "Reed-Schalter"
    entity_category: diagnostic
    pin:
      number: GPIO16
      mode: INPUT_PULLUP
      inverted: true
    # Auch beim Start auswerten: Deckel zu beim Einschalten = gleich Standby,
    # Deckel offen = Begrüßung
    trigger_on_initial_state: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_state:
      - binary_sensor.template.publish:
          id: standby
          state: !lambda 'return x == ${reed_standby_bei_magnet};'
      - script.execute: standby_aenderung

  - platform: template
    id: standby
    name: "Standby"

  # Einmal = Wiedergabe/Pause, doppelt = nächster, dreifach = vorheriger Titel,
  # halten = Karte von vorne.
  # Ein einzelner Druck wird erst nach der Pause gemeldet (Abstand), damit Mehrfach-
  # klicks erkannt werden. Die LED folgt dem Wiedergabestatus aus Home Assistant.
  - platform: gpio
    id: btn_play
    name: "Taste Play/Pause"
    pin:
      number: GPIO26
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_multi_click:
      - timing:
          - ON for at least 1s
        then:
          - script.execute: { id: taste_melden, art: "lang" }
      - timing:
          - ON for at most 600ms
          - OFF for at most ${klick_abstand}
          - ON for at most 600ms
          - OFF for at most ${klick_abstand}
          - ON for at most 600ms
          - OFF for at least ${klick_abstand}
        then:
          - script.execute: { id: taste_melden, art: "dreifach" }
      - timing:
          - ON for at most 600ms
          - OFF for at most ${klick_abstand}
          - ON for at most 600ms
          - OFF for at least ${klick_abstand}
        then:
          - script.execute: { id: taste_melden, art: "doppelt" }
      - timing:
          - ON for at most 600ms
          - OFF for at least ${klick_abstand}
        then:
          - script.execute: { id: taste_melden, art: "kurz" }

# ---------- Logik ----------
script:
  # Tastendruck an Home Assistant (nur bei offenem Deckel); Mehrfachklick quittiert die LED
  - id: taste_melden
    parameters:
      art: string
    then:
      - if:
          condition:
            binary_sensor.is_off: standby
          then:
            - event.trigger:
                id: ev_play
                event_type: !lambda 'return art;'
            - if:
                condition:
                  lambda: 'return art != "kurz" && id(current_tag).state != "none";'
                then:
                  - script.execute: tag_feedback

  # Karte an Home Assistant melden (Einlegen, Wechsel oder Deckel auf mit Karte)
  - id: karte_melden
    parameters:
      tag: string
      quittung: bool
    then:
      - text_sensor.template.publish:
          id: current_tag
          state: !lambda 'return tag;'
      - homeassistant.tag_scanned: !lambda 'return tag;'
      - lambda: 'id(scan_count)++;'
      - sensor.template.publish:
          id: scan_count_sensor
          state: !lambda 'return id(scan_count);'
      - text_sensor.template.publish:
          id: last_tag_id
          state: !lambda 'return tag;'
      - text_sensor.template.publish:
          id: last_tag_time
          state: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("keine Uhrzeit");
            return t.strftime("%d.%m. %H:%M:%S");
      - binary_sensor.template.publish:
          id: tag_present
          state: true
      - if:
          condition:
            lambda: 'return quittung;'
          then:
            - script.execute: tag_feedback
          else:
            - script.execute: update_play_led

  # Karte entfernt, aber erst nach der Entprellzeit
  - id: tag_gone
    mode: restart
    then:
      - delay: ${remove_delay}
      - text_sensor.template.publish:
          id: current_tag
          state: "none"
      - binary_sensor.template.publish:
          id: tag_present
          state: false
      - script.execute: update_play_led

  # Deckel zu: Karte als entfernt melden (Home Assistant pausiert), LED klingt langsam aus.
  # Deckel auf: Begrüßung; steht die Karte noch im Deckel, neu melden (Fortsetzen).
  - id: standby_aenderung
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_on: standby
          then:
            - script.stop: tag_gone
            - script.stop: begruessung
            - script.stop: tag_feedback
            - script.stop: lock_feedback
            - globals.set: { id: animation, value: 'false' }
            - text_sensor.template.publish:
                id: current_tag
                state: "none"
            - binary_sensor.template.publish:
                id: tag_present
                state: false
            - light.turn_off: { id: led_play, transition_length: 1500ms }
          else:
            - script.execute: begruessung
            - if:
                condition:
                  lambda: 'return !id(karte_im_feld).empty();'
                then:
                  - script.execute:
                      id: karte_melden
                      tag: !lambda 'return id(karte_im_feld);'
                      quittung: false

  # Ohne Karte oder im Standby alles aus.
  # Play-LED: playing = an, paused = pulsieren, sonst schwach.
  - id: update_play_led
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(animation);'
          then:
            - logger.log:
                level: VERBOSE
                format: "LED wartet auf das Ende der Animation"
          else:
            - if:
                condition:
                  lambda: 'return id(standby).state || id(current_tag).state == "none" || id(current_tag).state.empty();'
                then:
                  - light.turn_off: led_play
                else:
                  - if:
                      condition:
                        text_sensor.state:
                          id: playback_state
                          state: "playing"
                      then:
                        - light.turn_on: { id: led_play, brightness: 70%, effect: "None" }
                      else:
                        - if:
                            condition:
                              text_sensor.state:
                                id: playback_state
                                state: "paused"
                            then:
                              - light.turn_on: { id: led_play, effect: "Pulse" }
                            else:
                              - light.turn_on: { id: led_play, brightness: 20%, effect: "None" }

  # Begrüßung beim Öffnen des Deckels und beim Einschalten mit offenem Deckel:
  # aufgehen wie die Sonne, einmal atmen, dann in den Status übergehen (etwa 2,5 s)
  - id: begruessung
    mode: restart
    then:
      - globals.set: { id: animation, value: 'true' }
      - light.turn_off: { id: led_play, transition_length: 0s }
      - light.turn_on: { id: led_play, brightness: 100%, transition_length: 800ms }
      - delay: 900ms
      - light.turn_on: { id: led_play, brightness: 30%, transition_length: 400ms }
      - delay: 400ms
      - light.turn_on: { id: led_play, brightness: 100%, transition_length: 400ms }
      - delay: 500ms
      - globals.set: { id: animation, value: 'false' }
      - if:
          condition:
            lambda: 'return id(current_tag).state == "none" || id(current_tag).state.empty();'
          then:
            # Ohne Karte sanft ausklingen
            - light.turn_off: { id: led_play, transition_length: 800ms }
          else:
            - script.execute: update_play_led

  # Gesperrt: LED 3× langsam hart blinken (unterscheidbar von Quittung und Begrüßung)
  - id: lock_feedback
    mode: restart
    then:
      - script.stop: tag_feedback
      - script.stop: begruessung
      - globals.set: { id: animation, value: 'true' }
      - repeat:
          count: 3
          then:
            - light.turn_on: { id: led_play, effect: "None" }
            - light.turn_on: { id: led_play, brightness: 100%, transition_length: 0s }
            - delay: 300ms
            - light.turn_off: { id: led_play, transition_length: 0s }
            - delay: 300ms
      - globals.set: { id: animation, value: 'false' }
      - script.execute: update_play_led

  # Quittung beim Einlegen einer Karte: zweimal weich aufleuchten
  - id: tag_feedback
    mode: restart
    then:
      - script.stop: begruessung
      - globals.set: { id: animation, value: 'true' }
      - light.turn_on: { id: led_play, effect: "None" }
      - repeat:
          count: 2
          then:
            - light.turn_on: { id: led_play, brightness: 100%, transition_length: 150ms }
            - delay: 200ms
            - light.turn_on: { id: led_play, brightness: 15%, transition_length: 200ms }
            - delay: 220ms
      - globals.set: { id: animation, value: 'false' }
      - script.execute: update_play_led
